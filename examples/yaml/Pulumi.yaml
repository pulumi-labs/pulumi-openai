name: openai
runtime: yaml

resources:
  supportAgent:
    type: openai:Agent
    properties:
      model: gpt-5
      name: support-agent
      instructions: You answer customer questions about orders.
      metadata:
        managed-by: pulumi
      reasoning:
        effort: low
      tools:
        - type: web_search
  dailyDigest:
    type: openai:PeriodicAutomation
    properties:
      name: daily-digest
      expression: 0 9 * * 1-5
      timezone: Europe/Amsterdam
      target:
        agentId: ${supportAgent.id}
        environment:
          type: none
        input:
          - content:
              - type: input_text
                text: Summarize yesterday's open orders.

outputs:
  agentId: ${supportAgent.id}
  automationStatus: ${dailyDigest.status}
